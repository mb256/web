{% extends 'prelezy/base_routes.html' %}

{% block templ_main_content %}

<!-- Hero Section -->
<section class="hero-section">
    <h2>{% if active_view == 'top10' %}Top 10 - plovoucí rok{% else %}Poslední Přelezy{% endif %}</h2>
    <div class="view-switch">
        <a href="?view=last" class="switch-btn{% if active_view != 'top10' %} active{% endif %}">Poslední Přelezy</a>
        <a href="?view=top10" class="switch-btn{% if active_view == 'top10' %} active{% endif %}">Top 10 - plovoucí rok</a>
    </div>
</section>

<!-- Loading Overlay -->
<div id="loading-overlay">
    <div class="loader-ring"></div>
    <p id="loader-text">Stahuji data</p>
</div>

<!-- Climbers Rankings Section — populated by JS -->
<section class="routes-section" id="climbers-section" style="display:none"></section>

<script>
(function () {
    const messages = [
        'Stahuji data',
        'Vydrž',
        'Vydrž prďka, vydrž',
        'Už to bude',
        'Skoro tam',
        'Poslední cesta',
        'No dobře tak ještě jedna',
        'A ještě kousek',
    ];
    let msgIndex = 0;
    const loaderText = document.getElementById('loader-text');

    const textInterval = setInterval(() => {
        msgIndex = (msgIndex + 1) % messages.length;
        loaderText.style.opacity = '0';
        setTimeout(() => {
            loaderText.textContent = messages[msgIndex];
            loaderText.style.opacity = '1';
        }, 300);
    }, 2200);

    const activeView = new URLSearchParams(window.location.search).get('view') || 'last';

    fetch(`/prelezy/data/?view=${activeView}`)
        .then(r => r.json())
        .then(data => {
            clearInterval(textInterval);
            renderClimbers(data.climbers);
            document.getElementById('loading-overlay').style.display = 'none';
            const section = document.getElementById('climbers-section');
            section.style.display = '';
            attachToggleListeners();
        })
        .catch(() => {
            clearInterval(textInterval);
            loaderText.textContent = 'Chyba při načítání dat';
        });

    function renderClimbers(climbers) {
        const section = document.getElementById('climbers-section');
        section.innerHTML = climbers.map((c, i) => {
            const id = `climber-${i + 1}`;
            const lastDate = c.last_climb_date
                ? `<p class="last-climb-date">Poslední prelez: ${c.last_climb_date}</p>` : '';
            let detailContent;
            if (c.error) {
                detailContent = `<div class="error-message"><p>${c.error}</p></div>`;
            } else if (c.routes && c.routes.length) {
                const rows = c.routes.map(r => `
                    <tr>
                        <td data-label="Cesta">${r.name}</td>
                        <td data-label="Sektor">${r.sector}</td>
                        <td data-label="Styl">${r.style}</td>
                        <td data-label="Obtížnost">${r.difficulty}</td>
                        <td data-label="Datum">${r.date}</td>
                    </tr>`).join('');
                detailContent = `
                    <div class="table-container">
                        <table class="routes-table">
                            <thead><tr>
                                <th>Cesta</th><th>Sektor</th><th>Styl</th><th>Obtížnost</th><th>Datum</th>
                            </tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            } else {
                detailContent = `<div class="no-routes"><p>Žádné přelezy k zobrazení</p></div>`;
            }
            return `
            <div class="climber-container">
                <div class="climber-summary" data-climber-id="${id}">
                    <div class="climber-info">
                        <div class="climber-name-block">
                            <h3 class="climber-name">${c.name}</h3>
                            ${lastDate}
                        </div>
                        <div class="climber-points">
                            <span class="points-value">${c.total_points}</span>
                            <span class="points-label">bodů</span>
                        </div>
                    </div>
                    <button class="detail-toggle" data-toggle="${id}">
                        <span class="toggle-text">detail</span>
                        <span class="toggle-icon">▼</span>
                    </button>
                </div>
                <div class="climber-details" id="${id}">${detailContent}</div>
            </div>`;
        }).join('');
    }

    function attachToggleListeners() {
        document.querySelectorAll('.detail-toggle').forEach(button => {
            button.addEventListener('click', function () {
                const targetId = this.getAttribute('data-toggle');
                const targetDetails = document.getElementById(targetId);
                const container = this.closest('.climber-container');
                if (targetDetails) {
                    container.classList.toggle('expanded');
                    targetDetails.classList.toggle('show');
                    const icon = this.querySelector('.toggle-icon');
                    if (icon) {
                        icon.style.transform = container.classList.contains('expanded')
                            ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                }
            });
        });
    }
})();
</script>

<style>
    /* Loading overlay */
    #loading-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 5rem 1rem;
        gap: 1.5rem;
    }

    .loader-ring {
        width: 64px;
        height: 64px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--text-primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    #loader-text {
        color: var(--text-secondary);
        font-size: 1.1rem;
        font-style: italic;
        transition: opacity 0.3s ease;
        margin: 0;
    }

    /* View switch toggle */
    .view-switch {
        display: flex;
        justify-content: center;
        gap: 0;
        margin-top: 1rem;
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
    }

    .switch-btn {
        padding: 0.5rem 1.4rem;
        text-decoration: none;
        color: var(--text-secondary);
        background-color: rgba(255, 255, 255, 0.04);
        font-size: 0.9rem;
        font-weight: 500;
        transition: background-color 0.2s ease, color 0.2s ease;
        white-space: nowrap;
    }

    .switch-btn:first-child {
        border-right: 1px solid rgba(255, 255, 255, 0.2);
    }

    .switch-btn:hover {
        background-color: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
    }

    .switch-btn.active {
        background-color: rgba(255, 255, 255, 0.15);
        color: var(--text-primary);
        font-weight: 600;
    }

    .routes-section {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem;
    }

    .climber-container {
        margin-bottom: 1.5rem;
        background-color: var(--bg-secondary);
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        overflow: hidden;
    }

    /* Climber Summary Row */
    .climber-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem;
        background-color: var(--bg-secondary);
        cursor: pointer;
        transition: background-color 0.2s ease;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .climber-summary:hover {
        background-color: rgba(255, 255, 255, 0.05);
    }

    .climber-info {
        display: flex;
        align-items: center;
        gap: 2rem;
        flex: 1;
    }

    .climber-name-block {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .climber-name {
        color: var(--text-primary);
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
    }

    .last-climb-date {
        color: var(--text-secondary);
        margin: 0;
        font-size: 0.85rem;
        font-style: italic;
    }

    .climber-points {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.05);
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border-left: 3px solid var(--text-primary);
    }

    .points-value {
        color: var(--text-primary);
        font-size: 1.2rem;
        font-weight: 600;
    }

    .points-label {
        color: var(--text-secondary);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* Detail Toggle Button */
    .detail-toggle {
        padding: 0.5rem 1rem;
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: var(--text-primary);
        cursor: pointer;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
        font-size: 0.9rem;
        font-weight: 500;
        margin-left: 1rem;
    }

    .detail-toggle:hover {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.4);
    }

    .toggle-icon {
        display: inline-block;
        transition: transform 0.3s ease;
        font-size: 0.75rem;
    }

    /* Expandable Details Section */
    .climber-details {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.3s ease;
        opacity: 0;
    }

    .climber-details.show {
        max-height: 2000px;
        opacity: 1;
        padding: 1.5rem;
    }

    .table-container {
        overflow-x: auto;
    }

    .routes-table {
        width: 100%;
        border-collapse: collapse;
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        overflow: hidden;
    }

    .routes-table thead {
        background-color: rgba(255, 255, 255, 0.05);
    }

    .routes-table th {
        padding: 1rem;
        text-align: left;
        color: var(--text-primary);
        font-weight: 600;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    .routes-table td {
        padding: 0.875rem 1rem;
        color: var(--text-secondary);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .routes-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.05);
    }

    .routes-table tbody tr:last-child td {
        border-bottom: none;
    }

    .error-message {
        background-color: rgba(220, 53, 69, 0.2);
        border-left: 4px solid #dc3545;
        padding: 1rem;
        border-radius: 4px;
    }

    .error-message p {
        color: #ff6b6b;
        margin: 0;
    }

    .no-routes {
        background-color: rgba(255, 193, 7, 0.1);
        border-left: 4px solid #ffc107;
        padding: 1rem;
        border-radius: 4px;
    }

    .no-routes p {
        color: var(--text-secondary);
        margin: 0;
    }

    /* Mobile responsive styles */
    @media screen and (max-width: 768px) {
        .routes-section {
            padding: 1rem 0.5rem;
        }

        .climber-container {
            margin-bottom: 1rem;
        }

        .climber-summary {
            padding: 1rem;
            flex-wrap: wrap;
        }

        .climber-info {
            gap: 1rem;
            flex: 1 100%;
        }

        .climber-name {
            font-size: 1.2rem;
        }

        .climber-points {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .points-value {
            font-size: 1.4rem;
        }

        .detail-toggle {
            margin-left: 0;
            margin-top: 0.5rem;
        }

        .climber-details.show {
            padding: 1rem;
        }

        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .routes-table {
            font-size: 0.75rem;
            min-width: 100%;
        }

        .routes-table th {
            padding: 0.5rem 0.3rem;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .routes-table td {
            padding: 0.4rem 0.3rem;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        /* Make specific columns narrower on mobile */
        .routes-table td:nth-child(3), /* Styl */
        .routes-table th:nth-child(3) {
            max-width: 50px;
        }

        .routes-table td:nth-child(4), /* Obtížnost */
        .routes-table th:nth-child(4) {
            max-width: 60px;
        }

        .routes-table td:nth-child(5), /* Datum */
        .routes-table th:nth-child(5) {
            max-width: 80px;
        }

        .routes-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
    }

    @media screen and (max-width: 480px) {
        .climber-name {
            font-size: 1.1rem;
        }

        .last-climb-date {
            font-size: 0.75rem;
        }

        .climber-points {
            padding: 0.4rem 0.8rem;
        }

        .points-value {
            font-size: 1.3rem;
        }

        .points-label {
            font-size: 0.6rem;
        }

        .detail-toggle {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        .routes-table {
            font-size: 0.7rem;
        }

        .routes-table th {
            padding: 0.4rem 0.25rem;
            font-size: 0.65rem;
        }

        .routes-table td {
            padding: 0.35rem 0.25rem;
            font-size: 0.7rem;
            max-width: 120px;
        }

        /* Adjust column widths for very small screens */
        .routes-table td:nth-child(3), /* Styl */
        .routes-table th:nth-child(3) {
            max-width: 40px;
        }

        .routes-table td:nth-child(4), /* Obtížnost */
        .routes-table th:nth-child(4) {
            max-width: 50px;
        }

        .routes-table td:nth-child(5), /* Datum */
        .routes-table th:nth-child(5) {
            max-width: 70px;
            font-size: 0.65rem;
        }
    }
</style>

{% endblock %}
